name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run catches upstream breakage even when the repo is quiet.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      # openai-whisper (torch) is not needed: the tests never import it.
      - run: pip install pydantic pyyaml openai pytest ruff && pip install --no-deps -e .
      - run: ruff check --isolated --select E,F,I --line-length 120 .
      - run: pytest -q

  remotion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --prefix remotion
      - run: pip install pydantic pyyaml openai pytest && pip install --no-deps -e .
      - run: pytest -q tests/test_e2e.py
        env:
          E2E: "1"
