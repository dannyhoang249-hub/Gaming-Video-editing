[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Automated pipeline that turns long gaming streams and videos into branded highlight videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-whisper>=20231117",
  "openai>=3.58.0",
  "pydantic>=2.14.4",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
shorts = "shorts_factory.cli:main"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]